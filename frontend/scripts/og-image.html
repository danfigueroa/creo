<!doctype html>
<!--
  Fonte editável do card de compartilhamento (Open Graph).
  Regerar o PNG:
    "/Applications/Brave Browser.app/Contents/MacOS/Brave Browser" \
      --headless=new --disable-gpu --hide-scrollbars \
      --window-size=1200,630 --virtual-time-budget=10000 \
      --screenshot=public/og.png scripts/og-image.html
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&family=Source+Serif+4:ital,wght@0,400..600;1,400..600&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f0e6d0;
        --ink: #0e4a53;
        --muted: #6f8084;
        --line: rgba(14, 74, 83, 0.14);
        --serif: "Source Serif 4", Georgia, serif;
        --sans: "Geist", -apple-system, system-ui, sans-serif;
        --mono: "Geist Mono", ui-monospace, Menlo, monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        background: var(--bg);
        font-family: var(--sans);
        color: var(--ink);
        overflow: hidden;
        position: relative;
      }
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(720px 420px at 88% 18%, rgba(14, 74, 83, 0.07), transparent 70%),
          radial-gradient(560px 360px at 6% 96%, rgba(14, 74, 83, 0.05), transparent 70%);
      }
      .mark-bleed {
        position: absolute;
        right: -104px;
        top: 50%;
        transform: translateY(-50%);
        width: 620px;
        opacity: 0.07;
      }
      .stage {
        position: relative;
        height: 100%;
        padding: 76px 84px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .brand { display: flex; align-items: center; gap: 18px; }
      .brand__icon { width: 68px; height: 68px; border-radius: 16px; display: block; }
      .brand__name {
        font-family: var(--serif);
        font-weight: 500;
        font-size: 42px;
        letter-spacing: -0.015em;
      }
      .lead { max-width: 780px; }
      .lead__title {
        font-family: var(--serif);
        font-weight: 500;
        font-size: 78px;
        line-height: 1.04;
        letter-spacing: -0.022em;
      }
      .lead__title em { font-style: italic; font-weight: 400; }
      .lead__text {
        margin-top: 28px;
        font-size: 27px;
        line-height: 1.45;
        color: var(--muted);
        max-width: 680px;
      }
      .foot {
        display: flex;
        align-items: center;
        gap: 20px;
        padding-top: 30px;
        border-top: 1px solid var(--line);
      }
      .foot__url {
        font-family: var(--mono);
        font-weight: 500;
        font-size: 22px;
        letter-spacing: 0.02em;
      }
      .foot__dot { width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
      .foot__tag {
        font-size: 21px;
        color: var(--muted);
        letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>

    <svg class="mark-bleed" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M 31 8 C 26 14 18 24 16 36 C 15 44 18 52 24 56 C 28 52 31 44 32 36 Z" fill="#0E4A53" />
      <path d="M 33 8 C 38 14 46 24 48 36 C 49 44 46 52 40 56 C 36 52 33 44 32 36 Z" fill="#0E4A53" />
    </svg>

    <div class="stage">
      <div class="brand">
        <svg class="brand__icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="7" fill="#0E4A53" />
          <g transform="translate(16 16) scale(0.36) translate(-32 -32)">
            <path d="M 31 8 C 26 14 18 24 16 36 C 15 44 18 52 24 56 C 28 52 31 44 32 36 Z" fill="#F0E6D0" />
            <path d="M 33 8 C 38 14 46 24 48 36 C 49 44 46 52 40 56 C 36 52 33 44 32 36 Z" fill="#F0E6D0" />
          </g>
        </svg>
        <span class="brand__name">Creo</span>
      </div>

      <div class="lead">
        <h1 class="lead__title">A comunidade que <em>reza junta</em>.</h1>
        <p class="lead__text">
          Peça oração, reze pelos pedidos da sua comunidade e acompanhe as graças alcançadas.
        </p>
      </div>

      <div class="foot">
        <span class="foot__url">creo.com.br</span>
        <span class="foot__dot"></span>
        <span class="foot__tag">Para católicos e evangélicos</span>
      </div>
    </div>
  </body>
</html>
