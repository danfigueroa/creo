<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/creo-app-icon.svg" />
    <link rel="canonical" href="https://www.creo.com.br/" />
    <meta name="theme-color" content="#F0E6D0" />

    <title>Creo — a comunidade que reza junta</title>
    <meta
      name="description"
      content="Peça oração, reze pelos pedidos da sua comunidade e acompanhe as graças alcançadas. Para católicos e evangélicos."
    />

    <!-- Open Graph — WhatsApp, Facebook, LinkedIn, iMessage.
         URLs precisam ser absolutas: crawlers não resolvem caminho relativo. -->
    <meta property="og:site_name" content="Creo" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://www.creo.com.br/" />
    <meta property="og:title" content="Creo — a comunidade que reza junta" />
    <meta
      property="og:description"
      content="Peça oração, reze pelos pedidos da sua comunidade e acompanhe as graças alcançadas."
    />
    <meta property="og:image" content="https://www.creo.com.br/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Creo — a comunidade que reza junta"
    />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Creo — a comunidade que reza junta" />
    <meta
      name="twitter:description"
      content="Peça oração, reze pelos pedidos da sua comunidade e acompanhe as graças alcançadas."
    />
    <meta name="twitter:image" content="https://www.creo.com.br/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400..600;1,400..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
