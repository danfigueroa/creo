<!-- Supabase → Authentication → Email Templates → Magic Link
     Assunto: Seu link de acesso ao Creo
     O link usa token_hash (e não o ConfirmationURL padrão) para funcionar em
     qualquer navegador: o fluxo PKCE padrão só abre no navegador que pediu. -->
<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:0;background:#F0E6D0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F0E6D0;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#FBF6EA;border:1px solid #DCCFB4;border-radius:14px;">
            <tr>
              <td style="padding:32px 32px 8px;font-family:Georgia,'Times New Roman',serif;color:#0E4A53;font-size:22px;letter-spacing:-0.01em;">
                Creo
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 0;font-family:Georgia,'Times New Roman',serif;color:#0E4A53;font-size:26px;line-height:1.25;">
                Seu link de acesso
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 0;font-family:Helvetica,Arial,sans-serif;color:#2C4F55;font-size:15px;line-height:1.6;">
                Use o botão abaixo para entrar no Creo sem digitar a senha.
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px 8px;">
                <a href="{{ .SiteURL }}/auth?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;background:#0E4A53;color:#F0E6D0;text-decoration:none;font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;padding:12px 24px;border-radius:999px;">Entrar no Creo</a>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 32px;font-family:Helvetica,Arial,sans-serif;color:#6B7F82;font-size:12.5px;line-height:1.6;">
                O link vale por 1 hora e só pode ser usado uma vez. Se você não pediu, ninguém entra na sua conta sem ele — pode ignorar.
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-family:Helvetica,Arial,sans-serif;color:#8A8F86;font-size:12px;">
            Creo · www.creo.com.br
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
