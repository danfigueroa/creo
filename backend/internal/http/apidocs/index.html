<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Creo API</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.32.15/swagger-ui.css" />
    <style>
      body { margin: 0; }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.32.15/swagger-ui-bundle.js"></script>
    <script>
      // O backend roda na raiz em dev e sob /_/backend na Vercel. Derivar a
      // URL do spec do próprio caminho da página funciona nos dois sem config.
      var base = window.location.pathname.replace(/\/?$/, '/')
      window.ui = SwaggerUIBundle({
        url: base + 'openapi.yaml',
        dom_id: '#swagger-ui',
        deepLinking: true,
        persistAuthorization: true,
        tryItOutEnabled: true,
        displayRequestDuration: true,
        filter: true,
        docExpansion: 'none',
      })
    </script>
  </body>
</html>
